aid: casap
name: Casap
description: 'Casap is an award-winning agentic-AI dispute automation platform for banks,
  credit unions, and fintechs. It automates payment dispute (chargeback) intake, investigation,
  and resolution end to end, reducing operational cost and manual work while improving
  regulatory compliance and consumer satisfaction. The Casap REST API lets financial
  institutions programmatically create disputes, check dispute status, upload evidence
  files, and reopen disputes, backed by a hosted disputes dashboard, PCI-DSS and SOC 2
  (AICPA) controls, and integrations with card networks (Visa, Mastercard) and core
  banking systems (Symitar/Jack Henry, STAR). Casap won Best of Show at FinovateFall 2025.'
