openapi: 3.2.0
info:
  title: Casap Disputes API
  description: 'Public API for dispute creation and management. Recommended flow: List Accounts -> List Disputable Transactions -> Eligibility Check -> Get Dispute Reasons -> Get Questionnaire -> Create Dispute -> Upload Files (optional). List Member Disputes and Get Dispute Status power the member''s dispute screens.'
  version: '1.0'
security:
- api_key: []
tags:
- name: Disputes
paths:
  /v1/dispute/status/{disputeUuid}:
    get:
      summary: Get Dispute Status
      description: 'Returns full detail for a single dispute: current status, a human-readable status message, resolution deadline, and a chronological timeline of events (most recent first). Use this to power the dispute detail/status screen.'
      operationId: Disputes_GetDisputeStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetDisputeStatusResponse'
              example:
                dispute:
                  uuid: 67cdd4a7-b8c9-4d0e-a1b2-c3d4e5f6a7b8
                  shortId: D-67cdd4
                  status: DISPUTE_STATUS_OPEN
                  reason: DISPUTE_REASON_UNAUTH
                  disputeReason:
                    reason: DISPUTE_REASON_UNAUTH
                    displayMessage: Unauth
                  resolutionDeadline: 1719550028
                  customer:
                    uuid: 09e01299-e3a7-46c3-af16-a8316c30619e
                    name: John Doe
                    email: john.doe@example.com
                    phone: 123-456-7890
                statusMessage: Your claim is in progress. You received $132.88
                timeline:
                - eventType: TIMELINE_EVENT_TYPE_PROVISIONAL_CREDIT
                  message: You received provisional credit
                  subMessage: ''
                  timestamp: 1740441600
                  transactions:
                  - uuid: tx-001
                    merchant: TRANS/Kindle Unltd 888-802-3080 WA
                    amount:
                      amountInCents: 13189
                      currency: USD
                    settledTimestamp: 1737590400
                - eventType: TIMELINE_EVENT_TYPE_CREATED
                  message: You disputed a transaction
                  subMessage: ''
                  timestamp: 1740441600
                  transactions: []
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: disputeUuid
        in: path
        required: true
        schema:
          type: string
      tags:
      - Disputes
      x-partner: true
  /v1/disputes:
    get:
      operationId: Disputes_GetDisputes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetDisputesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: customerUuid
        in: query
        required: false
        schema:
          type: string
      - name: shortId
        in: query
        required: false
        schema:
          type: string
      tags:
      - Disputes
      summary: Disputes get disputes
      x-summary-source: derived
    post:
      summary: Create Dispute
      description: Files the dispute. Send the transactionId values from List Disputable Transactions in transaction_ids, the customer info, the selected dispute reason, and the questionnaire answers as question_uuid/answer pairs. Returns a DisputeSummary with the dispute's uuid (needed for Upload Files), shortId, resolutionDeadline, and any initial actions (e.g. issue provisional credit). Provide exactly one of transaction_ids or transaction_details; full transaction_details bodies remain supported for existing integrations.
      operationId: Disputes_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CreateDisputeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - Disputes
      x-partner: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1CreateDisputeRequest'
        required: true
  /v1/disputes/check-abuser:
    get:
      operationId: Disputes_CheckDisputeAbuser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CheckDisputeAbuserResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: orgUuid
        in: query
        required: false
        schema:
          type: string
      - name: externalIds
        in: query
        required: false
        schema:
          type: string
      tags:
      - Disputes
      summary: Disputes check dispute abuser
      x-summary-source: derived
  /v1/disputes/disputable-transactions:
    get:
      summary: List Disputable Transactions
      description: Returns the member's recent transactions that can be disputed; ineligible ones (too old, wrong status, already disputed) are filtered out. Each entry carries its payment rail (the full transaction type) and two flags, disputable and disputeInProgress, that tell your UI whether the member can select it. Send the returned transactionId values, unchanged, to the Eligibility Check and Create Dispute.
      operationId: Disputes_ListDisputableTransactions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListDisputableTransactionsResponse'
              example:
                transactions:
                - transactionId: tx-001
                  merchant: Amazon
                  amount:
                    amountInCents: 4266
                    currency: USD
                  date: 1749427200
                  rail: TRANSACTION_TYPE_DEBIT_CARD
                  disputable: true
                  disputeInProgress: false
                - transactionId: tx-002
                  merchant: Netflix
                  amount:
                    amountInCents: 1599
                    currency: USD
                  date: 1749427200
                  rail: TRANSACTION_TYPE_ACH
                  disputable: true
                  disputeInProgress: false
                - transactionId: tx-003
                  merchant: Spotify
                  amount:
                    amountInCents: 999
                    currency: USD
                  date: 1749340800
                  rail: TRANSACTION_TYPE_DEBIT_CARD
                  disputable: true
                  disputeInProgress: true
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: customerUuid
        description: 'customer_uuid is the member identifier returned by ListAccounts. The

          encrypted tax-id form is not accepted here.'
        in: query
        required: false
        schema:
          type: string
      - name: accountUuid
        in: query
        required: false
        schema:
          type: string
      - name: accountType
        description: 'account_type is the account''s account_type, from its matching ListAccounts

          entry. Optional; passing it makes the lookup faster.'
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACCOUNT_TYPE_UNKNOWN
          - ACCOUNT_TYPE_DEBIT
          - ACCOUNT_TYPE_CREDIT
          default: ACCOUNT_TYPE_UNKNOWN
      tags:
      - Disputes
      x-partner: true
  /v1/disputes/eligibility:
    get:
      summary: Eligibility Check
      description: Required step between transaction selection and the reasons screen. Checks that each selected transaction is eligible — including the org's own disputability rules — and that the selection uses a single payment rail and a single card. On failure, returns one structured error per failed rule with a machine-readable code and a member-facing message, so the member can adjust their selection without leaving the flow. See "Eligibility error codes" in the Disputes API (Self-Service) introduction for the full list and recommended UI handling.
      operationId: Disputes_CheckDisputeEligibility
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CheckDisputeEligibilityResponse'
              example:
                eligible: false
                errors:
                - code: RAIL_MISMATCH
                  message: Please select transactions of the same type. You cannot mix ACH and Debit transactions in a single dispute.
                  transactionIds:
                  - tx-001
                  - tx-002
                - code: TRANSACTION_ALREADY_DISPUTED
                  message: This transaction is already part of an open dispute.
                  transactionIds:
                  - tx-003
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: customerUuid
        description: 'customer_uuid is the member identifier returned by ListAccounts. The

          encrypted tax-id form is not accepted here.'
        in: query
        required: false
        schema:
          type: string
      - name: accountUuid
        in: query
        required: false
        schema:
          type: string
      - name: transactionIds
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: transactionDates
        description: 'Optional lookup hint: transaction_dates[i] is the approximate date of

          transaction_ids[i], matched +/-1 day; only the date portion is used.

          Providing it speeds the lookup; omitting it or getting it wrong never

          changes the result. May be shorter than transaction_ids; missing entries

          fall back to an unscoped lookup.'
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            format: date-time
      tags:
      - Disputes
      x-partner: true
  /v1/disputes/list:
    get:
      summary: List Member Disputes
      description: 'Returns a paginated list of disputes for a given customer. Each entry includes the dispute short ID, total disputed amount, and open/closed status. Does not include transaction-level detail — use Get Dispute Status for that. Default: 10 most recent disputes; maximum: 30 per request. Only disputes created in the last six months are returned, newest first. The window is based on creation date, so an older dispute is not listed even if it is still open.'
      operationId: Disputes_ListMemberDisputes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListMemberDisputesResponse'
              example:
                disputes:
                - disputeUuid: 67cdd4a7-b8c9-4d0e-a1b2-c3d4e5f6a7b8
                  shortId: D-67cdd4
                  disputedAmount:
                    amountInCents: 11838
                    currency: USD
                  status: DISPUTE_STATUS_OPEN
                  createdAt: 1716958028
                - disputeUuid: 404e55b2-c3d4-4e5f-b6a7-d8e9f0a1b2c3
                  shortId: D-404e55
                  disputedAmount:
                    amountInCents: 12284
                    currency: USD
                  status: DISPUTE_STATUS_CLOSED
                  createdAt: 1716871628
                nextPageToken: ''
                totalCount: 2
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: customerUuid
        description: required; the member identifier returned by ListAccounts (the encrypted tax-id form is not accepted here)
        in: query
        required: false
        schema:
          type: string
      - name: pageSize
        description: default 10, max 30; larger values are capped rather than rejected
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: opaque cursor returned as next_page_token by a prior call; empty for the first page
        in: query
        required: false
        schema:
          type: string
      - name: statusFilter
        description: 'Optional status filter. DISPUTE_STATUS_UNKNOWN (the default) returns all

          disputes; OPEN or CLOSED restrict the result accordingly.'
        in: query
        required: false
        schema:
          type: string
          enum:
          - DISPUTE_STATUS_UNKNOWN
          - DISPUTE_STATUS_OPEN
          - DISPUTE_STATUS_CLOSED
          default: DISPUTE_STATUS_UNKNOWN
      tags:
      - Disputes
      x-partner: true
  /v1/disputes/questionnaire:
    get:
      summary: Get Questionnaire
      description: Returns the intake questionnaire for the selected dispute reason and transaction context. Each question includes a unique questionUuid, the input type to render, and allowed answer options. The member's questionnaire answers determine the specific sub-reason. Submit question_uuid/answer pairs in Create Dispute.
      operationId: Disputes_GetQuestionnaire
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetQuestionnaireResponse'
              example:
                questions:
                - questionUuid: a1b2c3d4-0001-4000-8000-000000000001
                  questionText: Did you authorize this transaction?
                  inputType: INPUT_TYPE_RADIO
                  options:
                  - value: 'yes'
                    displayText: 'Yes'
                  - value: 'no'
                    displayText: 'No'
                  required: true
                - questionUuid: a1b2c3d4-0001-4000-8000-000000000003
                  questionText: When did you first notice the unauthorized transaction?
                  inputType: INPUT_TYPE_DATE
                  options: []
                  required: true
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: reason
        description: " - DISPUTE_REASON_ACH_ISSUE: Unauthorized ACH debit. Other ACH problems use the more specific\nDISPUTE_REASON_ACH_* values.\n - DISPUTE_REASON_ACH_CREDIT_ISSUE: Dispute about an ACH credit (incoming or outgoing credit entry), as\nopposed to the ACH_ISSUE_* family, which covers consumer debit disputes."
        in: query
        required: false
        schema:
          type: string
          enum:
          - DISPUTE_REASON_UNKNOWN
          - DISPUTE_REASON_UNAUTH
          - DISPUTE_REASON_MERCHANT_ISSUE
          - DISPUTE_REASON_ATM_ISSUE
          - DISPUTE_REASON_ACH_ISSUE
          - DISPUTE_REASON_TRANSFER_ISSUE
          - DISPUTE_REASON_ATM_ISSUE_CASH_NOT_DISPENSED
          - DISPUTE_REASON_MERCHANT_ISSUE_GOODS_OR_SERVICES_NOT_RECEIVED
          - DISPUTE_REASON_MERCHANT_ISSUE_GOODS_OR_SERVICES_NOT_AS_DESCRIBED
          - DISPUTE_REASON_MERCHANT_ISSUE_RETURNED
          - DISPUTE_REASON_MERCHANT_ISSUE_CANCELED_SUBSCRIPTION
          - DISPUTE_REASON_MERCHANT_ISSUE_REFUND_NOT_RECEIVED
          - DISPUTE_REASON_MERCHANT_ISSUE_CHARGED_INCORRECT_AMOUNT
          - DISPUTE_REASON_MERCHANT_ISSUE_PAID_BY_OTHER_MEANS
          - DISPUTE_REASON_TRANSFER_ISSUE_NOT_RECEIVED
          - DISPUTE_REASON_TRANSFER_ISSUE_INCORRECT_RECIPIENT
          - DISPUTE_REASON_TRANSFER_ISSUE_INCORRECT_AMOUNT
          - DISPUTE_REASON_TRANSFER_ISSUE_DUPLICATE_CHARGE
          - DISPUTE_REASON_ATM_ISSUE_PARTIAL_CASH
          - DISPUTE_REASON_MERCHANT_ISSUE_DUPLICATE_CHARGE
          - DISPUTE_REASON_ATM_ISSUE_CASH_NOT_DEPOSITED
          - DISPUTE_REASON_TRANSFER_ISSUE_FAILED_CANCELLATION
          - DISPUTE_REASON_ACH_ISSUE_REVOKED
          - DISPUTE_REASON_ACH_ISSUE_GOODS_OR_SERVICES
          - DISPUTE_REASON_ACH_ISSUE_INCOMPLETE_TRANSACTION
          - DISPUTE_REASON_ACH_ISSUE_IMPROPER_CHECK_PROCESSED
          - DISPUTE_REASON_ACH_ISSUE_INCORRECT_AMOUNT
          - DISPUTE_REASON_ACH_ISSUE_INCORRECT_DATE
          - DISPUTE_REASON_ACH_ISSUE_DEBITED_MORE_THAN_ONCE
          - DISPUTE_REASON_ACH_ISSUE_UNPROMPTED_DEBIT
          - DISPUTE_REASON_ATM_ISSUE_DEPOSIT_NOT_POSTED
          - DISPUTE_REASON_IN_STORE_CASH_NOT_DEPOSITED
          - DISPUTE_REASON_CHECK_ISSUE
          - DISPUTE_REASON_CHECK_ISSUE_FORGED_DRAWER
          - DISPUTE_REASON_CHECK_ISSUE_ENDORSEMENT_FORGED
          - DISPUTE_REASON_CHECK_ISSUE_PAYEE_NAME_ALTERED
          - DISPUTE_REASON_CHECK_ISSUE_NOT_ENDORSED_BY_PAYEE
          - DISPUTE_REASON_CHECK_ISSUE_ALTERED_AMOUNT
          - DISPUTE_REASON_CHECK_ISSUE_COUNTERFEIT_CHECK
          - DISPUTE_REASON_CHECK_ISSUE_UNAUTHORIZED_DRAFT
          - DISPUTE_REASON_ACH_CREDIT_ISSUE
          - DISPUTE_REASON_CREDIT_NOT_PROCESSED
          - DISPUTE_REASON_CANCELLED_TRANSACTION
          - DISPUTE_REASON_MERCHANDISE_RETURNED
          - DISPUTE_REASON_MERCHANT_ISSUE_SERVICES_CANCELLED
          default: DISPUTE_REASON_UNKNOWN
      - name: transactionType
        in: query
        required: false
        schema:
          type: string
          enum:
          - TRANSACTION_TYPE_UNKNOWN
          - TRANSACTION_TYPE_DEBIT_CARD
          - TRANSACTION_TYPE_CREDIT_CARD
          - TRANSACTION_TYPE_ATM
          - TRANSACTION_TYPE_ACH
          - TRANSACTION_TYPE_TRANSFER
          - TRANSACTION_TYPE_CREDIT_ATM
          - TRANSACTION_TYPE_CREDIT_ACH
          - TRANSACTION_TYPE_CREDIT_TRANSFER
          default: TRANSACTION_TYPE_UNKNOWN
      tags:
      - Disputes
      x-partner: true
  /v1/disputes/reasons:
    get:
      summary: Get Dispute Reasons
      description: Returns the set of applicable parent-level dispute reason categories for the selected transactions. The member selects one of these categories; the specific sub-reason is determined downstream by the member's answers to the intake questionnaire. Call this after the Eligibility Check passes.
      operationId: Disputes_GetDisputeReasons
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetDisputeReasonsResponse'
              example:
                disputeReasons:
                - reason: DISPUTE_REASON_UNAUTH
                  displayMessage: I did not authorize this transaction
                - reason: DISPUTE_REASON_MERCHANT_ISSUE
                  displayMessage: There is an issue with a merchant charge
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: transactionType
        in: query
        required: false
        schema:
          type: string
          enum:
          - TRANSACTION_TYPE_UNKNOWN
          - TRANSACTION_TYPE_DEBIT_CARD
          - TRANSACTION_TYPE_CREDIT_CARD
          - TRANSACTION_TYPE_ATM
          - TRANSACTION_TYPE_ACH
          - TRANSACTION_TYPE_TRANSFER
          - TRANSACTION_TYPE_CREDIT_ATM
          - TRANSACTION_TYPE_CREDIT_ACH
          - TRANSACTION_TYPE_CREDIT_TRANSFER
          default: TRANSACTION_TYPE_UNKNOWN
      tags:
      - Disputes
      x-partner: true
  /v1/disputes/transactions:
    get:
      operationId: Disputes_GetDisputeTransactions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetDisputeTransactionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: disputeUuid
        in: query
        required: false
        schema:
          type: string
      - name: customerUuid
        in: query
        required: false
        schema:
          type: string
      - name: accountUuid
        in: query
        required: false
        schema:
          type: string
      - name: orgUuid
        in: query
        required: false
        schema:
          type: string
      - name: externalIds
        in: query
        required: false
        schema:
          type: string
      tags:
      - Disputes
      summary: Disputes get dispute transactions
      x-summary-source: derived
  /v1/disputes/{disputeUuid}/files:
    post:
      summary: Upload Files
      description: Attaches a supporting document to an existing dispute. Optional; requires the dispute uuid returned by Create Dispute, so it can only run after creation. Returns the file_uuid of the stored file.
      operationId: Disputes_UploadFile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1UploadFileResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: disputeUuid
        description: The dispute UUID from the URL path
        in: path
        required: true
        schema:
          type: string
      tags:
      - Disputes
      x-partner: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputesUploadFileBody'
        required: true
  /v1/disputes/{disputeUuid}/reopen:
    post:
      operationId: Disputes_ReopenDispute
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ReopenDisputeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: disputeUuid
        in: path
        required: true
        schema:
          type: string
      tags:
      - Disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputesReopenDisputeBody'
        required: true
      summary: Disputes reopen dispute
      x-summary-source: derived
  /v1/transactions/arn:
    get:
      operationId: Disputes_GetArn
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetArnResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: customerUuid
        in: query
        required: false
        schema:
          type: string
      - name: transactionUuid
        in: query
        required: false
        schema:
          type: string
      tags:
      - Disputes
      summary: Disputes get arn
      x-summary-source: derived
components:
  schemas:
    dtoDisputeListItem:
      type: object
      properties:
        disputeUuid:
          type: string
        shortId:
          type: string
        disputedAmount:
          $ref: '#/components/schemas/api_publicdtoAmount'
          title: total disputed across the dispute's transactions
        status:
          $ref: '#/components/schemas/dtoDisputeStatus'
          title: open or closed
        createdAt:
          type: string
          format: int64
          title: unix seconds
      description: 'DisputeListItem is a member-facing summary row for the dispute-history list

        (ListMemberDisputes). It intentionally omits transaction-level detail — use

        Get Dispute Status for the full DisputeDetail.'
    dtoDisputedTransactionStatus:
      type: string
      enum:
      - DISPUTED_TRANSACTION_STATUS_UNKNOWN
      - DISPUTED_TRANSACTION_STATUS_OPEN
      - DISPUTED_TRANSACTION_STATUS_INVESTIGATING
      - DISPUTED_TRANSACTION_STATUS_CHARGEBACK
      - DISPUTED_TRANSACTION_STATUS_FINAL_DECISION
      - DISPUTED_TRANSACTION_STATUS_CLOSED
      default: DISPUTED_TRANSACTION_STATUS_UNKNOWN
    CreateDisputeRequestQuestionnaireAnswer:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        questionId:
          type: string
          description: 'Deprecated: use question_uuid instead. Still used for the legacy

            disputed-amount question keys (AMOUNT_EXPECTED, FIRST_AMOUNT,

            SECOND_AMOUNT), which are not returned by GetQuestionnaire.'
        questionUuid:
          type: string
          description: 'question_uuid is the stable id returned by GetQuestionnaire

            (QuestionDefinition.question_uuid). Preferred over the free-text

            `question`; optional for backwards compatibility.'
    v1GetArnResponse:
      type: object
      properties:
        arn:
          type: string
    dtoQuestionOption:
      type: object
      properties:
        value:
          type: string
          title: value to submit in questionnaire_answers
        displayText:
          type: string
          title: label to show the customer
      description: QuestionOption is an allowed answer value for a choice-style question.
    TransactionAuditLogRecordFinalDecisionDeniedType:
      type: string
      enum:
      - DENIED_TYPE_UNKNOWN
      - DENIED_TYPE_CHARGEBACK_LOST
      - DENIED_TYPE_FRIENDLY_FRAUD
      - DENIED_TYPE_INSUFFICIENT_EVIDENCE
      - DENIED_TYPE_WSUD_REJECTED
      - DENIED_TYPE_OTHER
      - DENIED_TYPE_FIRST_PARTY_FRAUD
      default: DENIED_TYPE_UNKNOWN
