      default: ELIGIBILITY_ERROR_CODE_UNKNOWN
      description: "EligibilityErrorCode is the machine-readable reason a selection is\nineligible. Transaction-scoped codes (RAIL_MISMATCH, CARD_MISMATCH, and the\nTRANSACTION_* values) name the offending ids in transaction_ids; the member\ncan adjust their selection. MEMBER_INELIGIBLE is member-scoped:\ntransaction_ids is empty and no selection change helps. See \"Eligibility\nerror codes\" in the Disputes API (Self-Service) introduction for handling\nguidance.\n\n - RAIL_MISMATCH: The selection mixes payment rails (e.g. ACH and Debit) that cannot be\ndisputed together.\n - TRANSACTION_INELIGIBLE: Deprecated: no longer returned. Match the specific TRANSACTION_* codes\ninstead.\n - MEMBER_INELIGIBLE: The member cannot file any dispute right now (e.g. classified as a\ndispute abuser), regardless of selection.\n - TRANSACTION_NOT_FOUND: A selected id matches no transaction on the member's account (stale,\nmistyped, or superseded).\n - TRANSACTION_NOT_SETTLED: A selected transaction has not settled yet; it can be disputed once it\ndoes.\n - TRANSACTION_ALREADY_DISPUTED: A selected transaction is already part of an open dispute.\n - TRANSACTION_OUTSIDE_ELIGIBILITY_WINDOW: A selected transaction is older than the org's configured window for\nself-service disputes.\n - CARD_MISMATCH: The selection spans more than one card.\n - TRANSACTION_NOT_DISPUTABLE: A selected transaction is excluded by the org's disputability rules\n(e.g. a transaction type the org does not allow to be disputed online)."
